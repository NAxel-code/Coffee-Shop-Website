<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order - MR.COFFEE</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/order.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <h1>MR.COFFEE</h1>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="rewards.html">Rewards</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="order.html" class="active">Order</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main>
        <section class="order-section">
            <h2>Place Your Order</h2>
            <form id="orderForm" class="order-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" required>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label for="address">Delivery Address</label>
                    <textarea id="address" name="address" required></textarea>
                    <span class="error-message"></span>
                </div>

                <div class="form-group">
                    <label>Select Items</label>
                    <div class="items-grid" id="itemsGrid">
                    </div>
                </div>


                <div class="form-group">
                    <label>Add-ons</label>
                    <div class="addons">
                        <label class="checkbox-label">
                            <input type="checkbox" name="addons" value="whipped-cream">
                            Whipped Cream (+$0.50)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="addons" value="caramel-syrup">
                            Caramel Syrup (+$0.50)
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="addons" value="chocolate-sauce">
                            Chocolate Sauce (+$0.50)
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="notes">Special Instructions</label>
                    <textarea id="notes" name="notes"></textarea>
                </div>

                <div class="order-summary">
                    <h3>Order Summary</h3>
                    <div class="summary-items">
                    </div>
                    <div class="total">
                        <span>Total:</span>
                        <span id="totalPrice">$0.00</span>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Place Order</button>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h3>MR.COFFEE</h3>
                <p>Making all taste coffee every day</p>
            </div>
            <div class="footer-section">
                <h3>Contact Us</h3>
                <p>Email: info@mrcoffee.com</p>
                <p>Phone: (123) 456-7890</p>
            </div>
            <div class="footer-section">
                <h3>Follow Us</h3>
                <div class="social-links">
                    <a href="#">Instagram</a>
                    <a href="#">Facebook</a>
                    <a href="#">Twitter</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2025 MR.COFFEE. All rights reserved.</p>
        </div>
    </footer>

    <script src="../js/order.js"></script>
</body>
</html>
